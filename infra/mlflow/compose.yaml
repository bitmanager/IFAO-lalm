services:
  tracking:
    image: ${MLFLOW_IMAGE:-ghcr.io/mlflow/mlflow:v3.17.0}
    container_name: speech-mlflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ${MLFLOW_DATA_DIR:-/var/lib/speech-mlflow/tracking}:/workspace/speech-llm/mlflow
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////workspace/speech-llm/mlflow/mlflow.db
      - --default-artifact-root
      - /workspace/speech-llm/mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - ${MLFLOW_ALLOWED_HOSTS:-localhost,127.0.0.1,127.0.0.1:5000}
      - --cors-allowed-origins
      - ${MLFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
